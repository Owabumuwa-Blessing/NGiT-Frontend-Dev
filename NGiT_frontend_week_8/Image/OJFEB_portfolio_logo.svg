<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#1A1824"/>
    </linearGradient>
    <linearGradient id="stripe1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5F3E"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <linearGradient id="stripe2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCF3E"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="stripe3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3EFFBC"/>
      <stop offset="100%" stop-color="#00B4D8"/>
