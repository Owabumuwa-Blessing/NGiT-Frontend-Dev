<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Validator Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image" href="OIP.webp">
</head>
<body>

    <div class="container">
        <div id="quizScreen">
            <h1>QUIZ</h1>
            <h2 id="question"></h2>

            <div id="options"></div>

            <p id="feedback"></p>

            <button id="nextBtn">Next</button>
        </div>

        <div id="resultScreen">
            <h2 id="finalScore"></h2>
            <button id="restartBtn">Restart Quiz</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
